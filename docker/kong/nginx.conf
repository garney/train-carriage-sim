worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 10m;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }
  map $http_origin $cors_origin {
    default $http_origin;
    '' *;
  }

  server {
    listen 8000;
    server_name _;

    location /auth/v1/ {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, apikey, Content-Type, X-Client-Info, X-Supabase-Api-Version, X-Requested-With" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Vary Origin always;
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
      }

      rewrite ^/auth/v1/(.*) /$1 break;
      proxy_pass http://auth:9999;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Origin $http_origin;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header apikey $http_apikey;
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Credentials;
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Allow-Credentials true always;
      add_header Access-Control-Expose-Headers "X-Total-Count, Link, X-Supabase-Api-Version" always;
      add_header Vary Origin always;
    }

    location /rest/v1/ {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, apikey, Content-Type, X-Client-Info, X-Supabase-Api-Version, X-Requested-With, Prefer, Range, Profile, Content-Profile, Accept-Profile" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Vary Origin always;
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
      }

      rewrite ^/rest/v1/(.*) /$1 break;
      proxy_pass http://rest:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Origin $http_origin;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header apikey $http_apikey;
      proxy_set_header Content-Profile public;
      proxy_set_header Accept-Profile public;
      proxy_hide_header Access-Control-Allow-Origin;
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Allow-Credentials true always;
      add_header Access-Control-Expose-Headers "Content-Range, Content-Location, Range-Unit, X-Total-Count, Link, Preference-Applied" always;
      add_header Vary Origin always;
    }

    location / {
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Content-Type application/json;
      return 200 '{"ok":true,"stack":"garney-local"}\n';
    }
  }
}
